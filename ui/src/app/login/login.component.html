<div class="min-h-screen bg-gradient-to-br from-blue-900 via-purple-900 to-pink-800 flex items-center justify-center p-4">
  <div class="card w-full max-w-md bg-white/10 backdrop-blur-lg shadow-2xl border border-white/20">
    <div class="card-body">
      <div class="text-center mb-6">
        <div class="inline-block p-4 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full shadow-lg mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5" />
          </svg>
        </div>
        <h2 class="text-3xl font-bold text-white">Smart Parking System</h2>
        <p class="text-gray-300 mt-2">AI-Powered Parking Management</p>
      </div>
      
      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div class="form-control">
          <label class="label">
            <span class="label-text text-white">Username</span>
          </label>
          <div class="relative">
            <span class="absolute left-3 top-3 text-gray-400">👤</span>
            <input 
              type="text" 
              [(ngModel)]="username" 
              name="username"
              class="input input-bordered w-full pl-10 bg-white/20 border-white/30 text-white placeholder:text-gray-400" 
              required
              placeholder="Enter username">
          </div>
        </div>
        
        <div class="form-control">
          <label class="label">
            <span class="label-text text-white">Password</span>
          </label>
          <div class="relative">
            <span class="absolute left-3 top-3 text-gray-400">🔒</span>
            <input 
              type="password" 
              [(ngModel)]="password" 
              name="password"
              class="input input-bordered w-full pl-10 bg-white/20 border-white/30 text-white placeholder:text-gray-400" 
              required
              placeholder="Enter password">
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary w-full mt-6" [disabled]="isLoading">
          <span *ngIf="!isLoading">Login</span>
          <span *ngIf="isLoading">Logging in...</span>
        </button>
        
        <div *ngIf="errorMessage" class="alert alert-error mt-4">
          <span>{{ errorMessage }}</span>
        </div>
      </form>
      
      <div class="divider text-gray-400">Demo Credentials</div>
      <div class="text-sm space-y-2 text-center text-gray-300">
        <p><span class="font-semibold text-white">Admin:</span> admin / Admin@123</p>
        <p><span class="font-semibold text-white">Operator:</span> operator / Admin@123</p>
        <p><span class="font-semibold text-white">Viewer:</span> viewer / Admin@123</p>
      </div>
    </div>
  </div>
</div>
